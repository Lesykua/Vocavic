<html lang="en">

      background-color: var(--surface-page);

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const DS = window.ShiftVoiceDesignSystem_2bf7db || {};
const { Button, Card, Badge, Eyebrow, MetricCard, Tag, StatusDot } = DS;

const DISPLAY = 'var(--font-display)';
const UI = 'var(--font-ui)';

// ─── Vocavic Wordmark (VOCA ink + VIC muted) ───────────────────────────────
function Wordmark({ theme = 'light', size = 20, style = {} }) {
  const ink = theme === 'dark' ? 'var(--sv-on-dark)' : 'var(--sv-navy)';
  const muted = theme === 'dark' ? 'var(--sv-on-dark-faint)' : 'var(--sv-steel)';
  return (
    <span style={{
      fontFamily: DISPLAY, fontWeight: 'var(--fw-black)',
      letterSpacing: 'var(--tracking-wordmark)', fontSize: size,
      lineHeight: 1, whiteSpace: 'nowrap', ...style,
    }}>
      <span style={{ color: ink }}>VOCA</span><span style={{ color: muted }}>VIC</span>
    </span>
  );
}

// ─── Figurative mark — gear + mic + sound waves (inline SVG) ────────────────
function Mark({ size = 34, color = 'var(--sv-teal)' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {/* gear */}
      <g opacity="0.9">
        <circle cx="24" cy="24" r="15" />
        {[0,45,90,135,180,225,270,315].map(a => {
          const r1 = 15, r2 = 18.5;
          const rad = (a * Math.PI) / 180;
          return <line key={a} x1={24 + r1 * Math.cos(rad)} y1={24 + r1 * Math.sin(rad)} x2={24 + r2 * Math.cos(rad)} y2={24 + r2 * Math.sin(rad)} />;
        })}
      </g>
      {/* mic body */}
      <rect x="20.5" y="14" width="7" height="13" rx="3.5" fill={color} stroke="none" />
      {/* mic stand */}
      <path d="M17 24a7 7 0 0 0 14 0" />
      <line x1="24" y1="31" x2="24" y2="34" />
    </svg>
  );
}

// ─── Nav ───────────────────────────────────────────────────────────────────
function Nav({ onCta, tweaks }) {
  return (
    <nav style={{
      position: 'sticky', top: 0, zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 var(--container-pad)', height: 64,
      background: 'rgba(242, 235, 224, 0.92)',
      backdropFilter: 'blur(12px)',
      borderBottom: '1px solid var(--sv-navy-a10)',
    }}>
      <span style={{ display: 'flex', alignItems: 'center', gap: 11 }}>
        <Mark size={30} />
        <Wordmark size={22} />
      </span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
        <div style={{ display: 'flex', gap: 22 }} className="vv-navlinks">
          {[['How it works','#how'],['Quotes','#quotes'],['Demo','#demo'],['Pricing','#pricing'],['About','#about']].map(([label, href]) => (
            <a key={label} href={href} style={{
              fontFamily: UI, fontSize: '0.875rem', fontWeight: 'var(--fw-medium)',
              color: 'var(--text-secondary)', textDecoration: 'none',
              transition: 'color var(--dur-fast) var(--ease-standard)',
            }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--text-primary)'}
              onMouseLeave={e => e.currentTarget.style.color = 'var(--text-secondary)'}
            >{label}</a>
          ))}
        </div>
        <Button variant="primary" size="sm" onClick={onCta}>{tweaks.ctaLabel}</Button>
      </div>
    </nav>
  );
}

// ─── Hero ──────────────────────────────────────────────────────────────────
function Hero({ tweaks, onCta }) {
  const lines = (tweaks.tagline || 'Capture every moment on the floor.')
    .split(/\.\s+/).filter(Boolean).map(l => l.replace(/\.$/, ''));

  return (
    <section style={{
      padding: '88px var(--container-pad) 72px',
      maxWidth: 'var(--container-max)', margin: '0 auto',
      display: 'grid', gridTemplateColumns: '1.05fr 0.95fr',
      gap: 64, alignItems: 'center',
    }}>
      <div>
        <div style={{ marginBottom: 24 }}>
          <Eyebrow pill>Structured operational memory</Eyebrow>
        </div>

        <h1 style={{
          fontFamily: DISPLAY, fontWeight: 'var(--fw-black)',
          fontSize: 'clamp(3rem, 5.5vw, var(--text-display-xl))',
          lineHeight: 'var(--leading-display)', letterSpacing: 'var(--tracking-tight)',
          color: 'var(--text-primary)', marginBottom: 24,
        }}>
          {lines.map((line, i) => <React.Fragment key={i}>{line}.<br /></React.Fragment>)}
        </h1>

        <p style={{
          fontSize: 'var(--text-lg)', lineHeight: 'var(--leading-normal)',
          color: 'var(--text-secondary)', maxWidth: '44ch', marginBottom: 32,
        }}>
          Your plant runs on memory that disappears every 8 hours. An operator speaks a short note at shift end — Vocavic transcribes it, structures it, and files it where the next shift, the RCA engineer, and the Tier meeting all read the same record.
        </p>

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center' }}>
          <Button variant="primary" size="lg" onClick={onCta}>{tweaks.ctaLabel} →</Button>
          <Button variant="secondary" size="lg" onClick={() => document.getElementById('demo')?.scrollIntoView({ behavior: 'smooth' })}>Watch the demo</Button>
        </div>

        <div style={{ marginTop: 22, display: 'flex', alignItems: 'center', gap: 10, color: 'var(--text-secondary)', fontSize: 'var(--text-sm)' }}>
          <StatusDot status="success" size={8} />
          Measured, not projected · 73% faster handover in pilot (15 min → 4 min)
        </div>
      </div>

      {/* Right: capture moment card */}
      <CaptureGlance />
    </section>
  );
}

// ─── Capture glance (hero visual) ──────────────────────────────────────────
function CaptureGlance() {
  return (
    <Card padding="0" radius="var(--radius-2xl)" style={{ overflow: 'hidden', boxShadow: 'var(--shadow-xl)' }}>
      {/* header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 20px', borderBottom: '1px solid var(--border-default)' }}>
        <Wordmark size={16} />
        <Badge status="info" dot>Capturing</Badge>
      </div>
      {/* waveform + mic */}
      <div style={{ padding: '28px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 18, background: 'var(--sv-teal-a06)' }}>
        <div style={{ display: 'flex', gap: 4, alignItems: 'center', height: 56 }}>
          {[16,30,46,28,54,38,22,48,34,52,26,42,18,36,50,24,40,30,20].map((h, i) => (
            <div key={i} style={{ width: 5, height: h, borderRadius: 3, background: 'var(--sv-teal)', opacity: 0.35 + (h / 90) }} />
          ))}
        </div>
        <div style={{ width: 60, height: 60, borderRadius: 'var(--radius-pill)', background: 'var(--sv-teal)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: 'var(--shadow-md)' }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--sv-white)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="var(--sv-white)" stroke="none" />
            <path d="M6 12a6 6 0 0 0 12 0" /><line x1="12" y1="18" x2="12" y2="21" />
          </svg>
        </div>
      </div>
      {/* extracted fields */}
      <div style={{ padding: '18px 20px 20px', display: 'grid', gap: 12 }}>
        <div style={{ fontSize: 'var(--text-sm)', lineHeight: 'var(--leading-snug)', color: 'var(--text-primary)' }}>
          “Line 2 sealer was running about 8 degrees warm near end of shift. Pulled a sample, raised the setpoint two notches, looks steady now — keep an eye on it.”
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          {[['Machine','Line 2 sealer'],['Component','sealer jaw'],['Reason','overheating'],['Action','raised setpoint']].map(([k, v]) => (
            <div key={k} style={{ padding: '8px 10px', borderRadius: 'var(--radius-sm)', background: 'var(--surface-page)', border: '1px solid var(--border-default)' }}>
              <div style={{ fontSize: '0.625rem', textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--text-secondary)', fontWeight: 'var(--fw-semibold)', marginBottom: 2 }}>{k}</div>
              <div style={{ fontSize: 'var(--text-sm)', fontWeight: 'var(--fw-semibold)', color: 'var(--text-primary)' }}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
          <div style={{ display: 'flex', gap: 6 }}>
            <Tag tone="tint">overheating</Tag>
            <Tag tone="tint">cooling</Tag>
          </div>
          <Badge status="success" dot>Completeness 100/100</Badge>
        </div>
      </div>
    </Card>
  );
}

// ─── Problem: the WPM gap ──────────────────────────────────────────────────
function TheGap() {
  const rows = [
    { label: 'Speaking', wpm: 150, pct: 100, tone: 'var(--sv-teal)', note: 'Fast and natural — but leaves no record' },
    { label: 'Typing',   wpm: 35,  pct: 23,  tone: 'var(--sv-amber)', note: 'Traceable — but slow and disruptive on the floor' },
    { label: 'Writing',  wpm: 12,  pct: 8,   tone: 'var(--sv-red)',   note: 'Durable on paper — but never searchable' },
  ];
  return (
    <section id="how" style={{ padding: '0 var(--container-pad) 88px', maxWidth: 'var(--container-max)', margin: '0 auto' }}>
      <Divider label="The gap" />
      <div style={{ display: 'grid', gridTemplateColumns: '0.9fr 1.1fr', gap: 56, alignItems: 'center', marginTop: 8 }}>
        <div>
          <h2 style={{ fontFamily: DISPLAY, fontWeight: 'var(--fw-black)', fontSize: 'clamp(2rem, 3.4vw, var(--text-display-lg))', lineHeight: 'var(--leading-tight)', letterSpacing: 'var(--tracking-tight)', marginBottom: 18 }}>
            150 wpm spoken.<br />35 wpm typed.<br />The math is simple.
          </h2>
          <p style={{ fontSize: 'var(--text-lg)', lineHeight: 'var(--leading-normal)', color: 'var(--text-secondary)', maxWidth: '42ch' }}>
            Operators know the most and write the least — not from carelessness, but because typing a structured report mid-shift competes with running the line. So the knowledge stays in their head and walks out at 6am. Voice closes the gap: speak once, and Vocavic does the structuring.
          </p>
        </div>
        <Card padding="var(--space-6)" style={{ display: 'grid', gap: 18 }}>
          {rows.map(({ label, wpm, pct, tone, note }) => (
            <div key={label}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
                <span style={{ fontSize: 'var(--text-base)', fontWeight: 'var(--fw-semibold)' }}>{label}</span>
                <span style={{ fontFamily: DISPLAY, fontWeight: 'var(--fw-black)', fontSize: '1.4rem', color: tone, fontVariantNumeric: 'tabular-nums' }}>{wpm}<span style={{ fontFamily: UI, fontSize: '0.75rem', fontWeight: 'var(--fw-semibold)', color: 'var(--text-secondary)', marginLeft: 4 }}>wpm</span></span>
              </div>
              <div style={{ height: 10, borderRadius: 'var(--radius-pill)', background: 'var(--sv-line)', overflow: 'hidden', marginBottom: 6 }}>
                <div style={{ height: '100%', width: `${pct}%`, borderRadius: 'var(--radius-pill)', background: tone, opacity: 0.85 }} />
              </div>
              <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>{note}</div>
            </div>
          ))}
          <div className="vv-hairline" style={{ paddingTop: 14, fontSize: 'var(--text-sm)', fontWeight: 'var(--fw-bold)', color: 'var(--sv-teal)', lineHeight: 'var(--leading-snug)' }}>
            Vocavic = voice speed + written traceability + structured search
          </div>
        </Card>
      </div>
    </section>
  );
}

// ─── Quotes ────────────────────────────────────────────────────────────────
function Quotes() {
  const quotes = [
    {
      text: "We're often getting two-line reports from operators. As a manager, I sometimes wonder what actually happened at the start of the day. Machines get prioritized, and note-taking is left for later — which never really happens.",
      name: "Plant Operations Manager", role: "Food & Beverage · 3 production lines", initial: "M",
    },
    {
      text: "A third of our floor crew are temporary workers and many don't speak the local language well. They can describe a problem clearly in their own words, but writing a structured note doesn't happen. If they could just talk it through, we'd catch so much more before the next shift inherits it.",
      name: "Shift Supervisor", role: "Packaging · Seasonal workforce", initial: "S",
    },
    {
      text: "The information lives in people's heads, not on paper. We've had incidents where the incoming supervisor had no idea a recurring issue had already been flagged three times that day. A spoken note would have changed the outcome.",
      name: "Head of Manufacturing Excellence", role: "Industrial Components · 2 sites", initial: "H",
    },
  ];
  return (
    <section id="quotes" style={{ padding: '0 var(--container-pad) 88px', maxWidth: 'var(--container-max)', margin: '0 auto' }}>
      <div style={{ textAlign: 'center', marginBottom: 44 }}>
        <Eyebrow>What we hear from operations teams</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontWeight: 'var(--fw-black)', fontSize: 'clamp(1.8rem, 3vw, var(--text-display-md))', lineHeight: 'var(--leading-tight)', marginTop: 12 }}>
          The problem isn't new. The capture layer is.
        </h2>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
        {quotes.map(({ text, name, role, initial }) => (
          <Card key={name} accentColor="var(--sv-teal)" accentSide="top" padding="var(--space-6)" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div style={{ fontFamily: DISPLAY, fontSize: '3.2rem', lineHeight: 0.7, color: 'var(--sv-teal)', opacity: 0.22, fontWeight: 'var(--fw-black)' }}>”</div>
            <p style={{ fontSize: 'var(--text-base)', lineHeight: 'var(--leading-normal)', color: 'var(--text-primary)', margin: 0, flex: 1 }}>{text}</p>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ width: 38, height: 38, borderRadius: 'var(--radius-pill)', background: 'var(--sv-teal)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: DISPLAY, fontSize: '1rem', fontWeight: 'var(--fw-black)', color: 'var(--sv-white)', flexShrink: 0 }}>{initial}</div>
              <div>
                <div style={{ fontSize: 'var(--text-sm)', fontWeight: 'var(--fw-bold)' }}>{name}</div>
                <div style={{ fontSize: 'var(--text-xs)', color: 'var(--text-secondary)', marginTop: 2 }}>{role}</div>
              </div>
            </div>
          </Card>
        ))}
      </div>
    </section>
  );
}

// ─── Video ─────────────────────────────────────────────────────────────────
const DEMO_VIDEO_URL = 'https://pub-37ac4a808ede49ccbfdb6b0f7f6b569d.r2.dev';

function VideoSection() {
  const [playing, setPlaying] = useState(false);
  const videoRef = useRef();

  function play() {
    setPlaying(true);
    setTimeout(() => videoRef.current && videoRef.current.play && videoRef.current.play(), 60);
  }

  return (
    <section id="demo" style={{ padding: '0 var(--container-pad) 88px', maxWidth: 1080, margin: '0 auto' }}>
      <div style={{ textAlign: 'center', marginBottom: 36 }}>
        <Eyebrow>See it on the floor</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontWeight: 'var(--fw-black)', fontSize: 'clamp(1.8rem, 3vw, var(--text-display-md))', lineHeight: 'var(--leading-tight)', marginTop: 12 }}>
          Two minutes, start to structured record
        </h2>
      </div>
      <div style={{
        position: 'relative', borderRadius: 'var(--radius-2xl)', overflow: 'hidden',
        boxShadow: 'var(--shadow-xl)', background: 'var(--sv-navy)', aspectRatio: '16 / 9',
        cursor: playing ? 'default' : 'pointer',
      }}
        onClick={() => { if (!playing) play(); }}
        onMouseEnter={e => { if (playing) return; const p = e.currentTarget.querySelector('.vv-play'); const o = e.currentTarget.querySelector('.vv-ov'); if (p) p.style.transform = 'scale(1.08)'; if (o) o.style.background = 'rgba(18,35,44,0.5)'; }}
        onMouseLeave={e => { if (playing) return; const p = e.currentTarget.querySelector('.vv-play'); const o = e.currentTarget.querySelector('.vv-ov'); if (p) p.style.transform = 'scale(1)'; if (o) o.style.background = 'rgba(18,35,44,0.4)'; }}
      >
        {playing ? (
          <video ref={videoRef} src={DEMO_VIDEO_URL} controls playsInline onEnded={() => setPlaying(false)}
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', background: '#000', zIndex: 20 }} />
        ) : (
          <>
            {/* Branded blueprint thumbnail */}
            <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(135deg, var(--sv-navy) 0%, var(--sv-navy-2) 100%)', overflow: 'hidden' }}>
              <div style={{ position: 'absolute', inset: 0, opacity: 0.08, backgroundImage: 'linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px)', backgroundSize: '60px 60px' }} />
              <div style={{ position: 'absolute', bottom: 34, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 4, alignItems: 'flex-end' }}>
                {[18,28,42,55,38,62,44,30,50,36,24,46,60,34,22,48,56,32,44,26].map((h, i) => (
                  <div key={i} style={{ width: 6, height: h, borderRadius: 3, background: 'var(--sv-teal-light)', opacity: 0.5 }} />
                ))}
              </div>
              <div style={{ position: 'absolute', top: 28, left: 28 }}><Wordmark theme="dark" size={18} /></div>
            </div>
            <div className="vv-ov" style={{ position: 'absolute', inset: 0, zIndex: 10, background: 'rgba(18,35,44,0.4)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16, transition: 'background var(--dur-base) var(--ease-standard)' }}>
              <div className="vv-play" style={{ width: 74, height: 74, borderRadius: 'var(--radius-pill)', background: 'var(--sv-floral)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: 'var(--shadow-lg)', transition: 'transform var(--dur-base) var(--ease-standard)' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M8 5.14v14l11-7-11-7z" fill="var(--sv-teal)" /></svg>
              </div>
              <div style={{ padding: '6px 16px', borderRadius: 'var(--radius-sm)', background: 'rgba(18,35,44,0.7)', fontSize: 'var(--text-sm)', fontWeight: 'var(--fw-semibold)', color: 'var(--sv-on-dark)', fontFamily: UI }}>Watch the demo →</div>
            </div>
          </>
        )}
      </div>
    </section>
  );
}

// ─── Divider with centered label ───────────────────────────────────────────
function Divider({ label }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 32 }}>
      <div style={{ flex: 1, height: 1, background: 'var(--sv-navy-a10)' }} />
      <Eyebrow>{label}</Eyebrow>
      <div style={{ flex: 1, height: 1, background: 'var(--sv-navy-a10)' }} />
    </div>
  );
}

// ─── Dashboard preview (inline) ────────────────────────────────────────────
function DashboardPreview() {
  const eyebrowSm = { fontSize: '0.625rem', letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text-secondary)', fontWeight: 'var(--fw-bold)', marginBottom: 6 };

      {/* topbar */}
      <Card padding="12px 16px" radius="var(--radius-md)" style={{ marginBottom: 14, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <Wordmark size={15} />

        </label>

// ─── App ───────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  function bookCall() {
    window.open(BOOKING_URL, '_blank', 'noopener,noreferrer');
  }
  function handleTweak(key, val) {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  }
  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  return (
    <>
      <Nav onCta={bookCall} tweaks={tweaks} />
      <Hero tweaks={tweaks} onCta={bookCall} />
      <TheGap />
      <Quotes />
      <VideoSection />
      <ProductTour />
      <Pricing onCta={bookCall} tweaks={tweaks} />
      <About />
      <Footer onCta={bookCall} tweaks={tweaks} />
      <TweaksPanel tweaks={tweaks} onChange={handleTweak} visible={tweaksVisible} />
    </>
  );
}
